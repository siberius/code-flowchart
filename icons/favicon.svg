<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>
  </defs>
  <!-- Dark Beveled Squircle -->
  <rect width="60" height="60" x="2" y="2" rx="14" fill="url(#fav-bg)" stroke="#00e5ff" stroke-width="2.5" />
  
  <!-- Flow Lines -->
  <path d="M 32 18 L 32 24" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 32 40 L 32 46" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 22 32 L 18 32 L 18 42 L 26 42" stroke="#c084fc" stroke-width="2" fill="none" />
  <path d="M 42 32 L 46 32 L 46 42 L 38 42" stroke="#38bdf8" stroke-width="2" fill="none" />

  <!-- 1. START (Emerald Pill) -->
  <rect x="18" y="8" width="28" height="10" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="2" />
  
  <!-- 2. DECISION (Amber Diamond) with robot lens -->
  <polygon points="32,23 42,32 32,41 22,32" fill="#78350f" stroke="#f59e0b" stroke-width="2.2" stroke-linejoin="round" />
  <circle cx="32" cy="32" r="3.5" fill="#00e5ff" />
  <circle cx="31" cy="31" r="1" fill="#ffffff" />
  
  <!-- 3. END (Cyan Pill) -->
  <rect x="18" y="46" width="28" height="10" rx="5" fill="#083344" stroke="#00e5ff" stroke-width="2" />
</svg>
