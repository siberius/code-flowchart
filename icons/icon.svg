<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Sci-Fi background -->
    <linearGradient id="cfc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b10" />
      <stop offset="50%" stop-color="#121620" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0099ff" />
    </linearGradient>
    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="metal-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with Bezel -->
  <rect width="504" height="504" x="4" y="4" rx="112" fill="url(#metal-bezel)" stroke="#00e5ff" stroke-width="4" stroke-opacity="0.4" />
  <rect width="480" height="480" x="16" y="16" rx="98" fill="url(#cfc-bg)" />

  <!-- Subtle Circuit Lines -->
  <g stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 40 180 L 120 180 L 150 210" />
    <path d="M 40 330 L 110 330 L 130 350" />
    <path d="M 470 140 L 400 140 L 370 170" />
    <path d="M 470 380 L 390 380 L 360 350" />
    <circle cx="150" cy="210" r="4" fill="#00e5ff" />
    <circle cx="130" cy="350" r="4" fill="#7c3aed" />
    <circle cx="370" cy="170" r="4" fill="#10b981" />
    <circle cx="360" cy="350" r="4" fill="#00e5ff" />
  </g>

  <!-- Connecting Arrows / Flow lines (with neon glow) -->
  <g filter="url(#neon-glow)">
    <!-- Line from START down to CHECK? -->
    <path d="M 256 108 L 256 160" stroke="#00ff88" stroke-width="8" stroke-linecap="round" />
    <polygon points="256,168 248,154 264,154" fill="#00ff88" />

    <!-- Branch from CHECK? right to PROCESS -->
    <path d="M 334 220 L 372 220" stroke="#c084fc" stroke-width="7" stroke-linecap="round" />
    <polygon points="380,220 368,213 368,227" fill="#c084fc" />

    <!-- Branch from PROCESS down and left to END -->
    <path d="M 426 256 L 426 330 L 290 330 L 290 380" stroke="#c084fc" stroke-width="6" stroke-linecap="round" fill="none" stroke-linejoin="round" />

    <!-- Main trunk from CHECK? down to END -->
    <path d="M 256 280 L 256 384" stroke="#00e5ff" stroke-width="8" stroke-linecap="round" />
    <polygon points="256,394 248,378 264,378" fill="#00e5ff" />
  </g>

  <!-- START Capsule (Top) -->
  <g filter="url(#neon-glow)">
    <rect x="180" y="60" width="152" height="48" rx="24" fill="url(#neon-green)" />
    <text x="256" y="92" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="900" fill="#090b10" text-anchor="middle" letter-spacing="1">START</text>
  </g>

  <!-- DIAMOND Decision Node (Center) with Robot Šroub Eye -->
  <g filter="url(#neon-glow)">
    <!-- Diamond -->
    <polygon points="256,160 334,220 256,280 178,220" fill="#121824" stroke="url(#neon-cyan)" stroke-width="7" stroke-linejoin="round" />
    
    <!-- Outer Eye Ring -->
    <circle cx="256" cy="220" r="32" fill="#1e293b" stroke="#00f5ff" stroke-width="3" />
    <!-- Aperture notches -->
    <circle cx="256" cy="192" r="3" fill="#00f5ff" />
    <circle cx="256" cy="248" r="3" fill="#00f5ff" />
    <circle cx="228" cy="220" r="3" fill="#00f5ff" />
    <circle cx="284" cy="220" r="3" fill="#00f5ff" />

    <!-- Pupil / Lens -->
    <circle cx="256" cy="220" r="20" fill="#090b10" />
    <circle cx="256" cy="220" r="14" fill="#00e5ff" />
    <circle cx="252" cy="216" r="5" fill="#ffffff" />
  </g>
  <text x="256" y="270" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00e5ff" text-anchor="middle" letter-spacing="1">CHECK?</text>

  <!-- PROCESS Block (Right) -->
  <g filter="url(#neon-glow)">
    <rect x="372" y="194" width="108" height="52" rx="10" fill="#1a162b" stroke="url(#neon-purple)" stroke-width="5" />
    <text x="426" y="226" font-family="'JetBrains Mono', system-ui, sans-serif" font-size="13" font-weight="900" fill="#f3e8ff" text-anchor="middle" letter-spacing="0.5">PROCESS</text>
  </g>

  <!-- END Capsule (Bottom) -->
  <g filter="url(#neon-glow)">
    <rect x="180" y="394" width="152" height="48" rx="24" fill="url(#neon-cyan)" />
    <text x="256" y="426" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="900" fill="#090b10" text-anchor="middle" letter-spacing="1">END</text>
  </g>
</svg>
