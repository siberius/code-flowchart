<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#141923" />
    </linearGradient>
    <linearGradient id="bezel-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="50%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#0f141d" />
    </linearGradient>

    <!-- Block Semantic Gradients (exact match to CodeFlowChart) -->
    <!-- START / END (Emerald) -->
    <linearGradient id="block-start-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <!-- DECISION (Amber Gold) -->
    <linearGradient id="block-dec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <!-- IO (Purple) -->
    <linearGradient id="block-io-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <!-- PROCESS (Blue) -->
    <linearGradient id="block-proc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <!-- END (Cyan/Emerald) -->
    <linearGradient id="block-end-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e4b55" />
      <stop offset="100%" stop-color="#04272e" />
    </linearGradient>

    <!-- Cyberpunk Neon Glow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="intense-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b1" />
      <feGaussianBlur stdDeviation="12" result="b2" />
      <feGaussianBlur stdDeviation="24" result="b3" />
      <feMerge>
        <feMergeNode in="b3" />
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glass Glare on Bezel -->
    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Outer Beveled Squircle Frame -->
  <rect width="500" height="500" x="6" y="6" rx="116" fill="url(#bezel-metal)" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.5" />
  <rect width="476" height="476" x="18" y="18" rx="104" fill="url(#cyber-bg)" />

  <!-- Cyberpunk Background Grid & Circuit Traces -->
  <g stroke="#1a2233" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="80" y1="18" x2="80" y2="494" />
    <line x1="160" y1="18" x2="160" y2="494" />
    <line x1="256" y1="18" x2="256" y2="494" />
    <line x1="352" y1="18" x2="352" y2="494" />
    <line x1="432" y1="18" x2="432" y2="494" />
    <line x1="18" y1="110" x2="494" y2="110" />
    <line x1="18" y1="210" x2="494" y2="210" />
    <line x1="18" y1="310" x2="494" y2="310" />
    <line x1="18" y1="410" x2="494" y2="410" />
  </g>

  <!-- High-tech Copper / Neon PCB Traces -->
  <g stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.35" fill="none" stroke-linecap="round">
    <path d="M 18 160 L 50 160 L 70 180 L 100 180" />
    <path d="M 18 360 L 60 360 L 80 340 L 110 340" />
    <path d="M 494 160 L 460 160 L 440 180 L 410 180" />
    <path d="M 494 360 L 450 360 L 430 340 L 400 340" />
    <circle cx="100" cy="180" r="3.5" fill="#f59e0b" />
    <circle cx="110" cy="340" r="3.5" fill="#ec4899" />
    <circle cx="410" cy="180" r="3.5" fill="#3b82f6" />
    <circle cx="400" cy="340" r="3.5" fill="#00e5ff" />
  </g>

  <!-- Flowchart Connecting Neon Buses & Lasers -->
  <g filter="url(#neon-glow)" fill="none">
    <!-- START down to DECISION -->
    <path d="M 256 122 L 256 170" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    <polygon points="256,180 248,166 264,166" fill="#10b981" />

    <!-- DECISION left to I/O (Purple branch) -->
    <path d="M 198 236 L 140 236 L 140 270" stroke="#c084fc" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round" />
    <polygon points="140,280 133,267 147,267" fill="#c084fc" />

    <!-- DECISION right to PROCESS (Blue branch) -->
    <path d="M 314 236 L 372 236 L 372 270" stroke="#38bdf8" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round" />
    <polygon points="372,280 365,267 379,267" fill="#38bdf8" />

    <!-- I/O down and merge into END -->
    <path d="M 140 334 L 140 365 L 235 365 L 235 390" stroke="#c084fc" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- PROCESS down and merge into END -->
    <path d="M 372 334 L 372 365 L 277 365 L 277 390" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Combined trunk down to END -->
    <path d="M 256 365 L 256 394" stroke="#00e5ff" stroke-width="6" stroke-linecap="round" />
    <polygon points="256,402 249,388 263,388" fill="#00e5ff" />
  </g>

  <!-- ==================== FLOWCHART BLOCKS ==================== -->

  <!-- 1. START BLOCK (Emerald Pill, border-radius 50px) -->
  <g filter="url(#intense-glow)">
    <rect x="180" y="74" width="152" height="48" rx="24" fill="url(#block-start-grad)" stroke="#10b981" stroke-width="4.5" />
    <text x="256" y="105" font-family="'JetBrains Mono', 'Syne', monospace" font-size="20" font-weight="900" fill="#a7f3d0" text-anchor="middle" letter-spacing="2">START</text>
  </g>

  <!-- 2. DECISION BLOCK (Amber Rhombus Diamond polygon 50% 0%, 100% 50%...) -->
  <g filter="url(#intense-glow)">
    <polygon points="256,170 326,236 256,302 186,236" fill="url(#block-dec-grad)" stroke="#f59e0b" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Robot ŠROUB Cybernetic Sensor Lens inside Decision -->
    <circle cx="256" cy="236" r="28" fill="#111827" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="256" cy="236" r="20" fill="#0f172a" stroke="#00e5ff" stroke-width="1.5" />
    <circle cx="256" cy="236" r="14" fill="#00e5ff" />
    <circle cx="256" cy="236" r="9" fill="#083344" />
    <circle cx="253" cy="233" r="3.5" fill="#ffffff" />
    <!-- Aperture Marks -->
    <line x1="256" y1="210" x2="256" y2="214" stroke="#f59e0b" stroke-width="2" />
    <line x1="256" y1="258" x2="256" y2="262" stroke="#f59e0b" stroke-width="2" />
    <line x1="230" y1="236" x2="234" y2="236" stroke="#f59e0b" stroke-width="2" />
    <line x1="278" y1="236" x2="282" y2="236" stroke="#f59e0b" stroke-width="2" />
  </g>

  <!-- 3. I/O BLOCK (Purple Parallelogram, skewed) -->
  <g filter="url(#neon-glow)">
    <polygon points="88,280 206,280 184,334 66,334" fill="url(#block-io-grad)" stroke="#8b5cf6" stroke-width="4" stroke-linejoin="round" />
    <text x="136" y="312" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#e9d5ff" text-anchor="middle" letter-spacing="1">VSTUP</text>
  </g>

  <!-- 4. PROCESS BLOCK (Blue Rectangle, rx 8) -->
  <g filter="url(#neon-glow)">
    <rect x="306" y="280" width="132" height="54" rx="8" fill="url(#block-proc-grad)" stroke="#3b82f6" stroke-width="4" />
    <text x="372" y="312" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#bae6fd" text-anchor="middle" letter-spacing="1">AKCE</text>
  </g>

  <!-- 5. END BLOCK (Cyan / Emerald Pill) -->
  <g filter="url(#intense-glow)">
    <rect x="180" y="402" width="152" height="48" rx="24" fill="url(#block-end-grad)" stroke="#00e5ff" stroke-width="4.5" />
    <text x="256" y="433" font-family="'JetBrains Mono', 'Syne', monospace" font-size="20" font-weight="900" fill="#a5f3fc" text-anchor="middle" letter-spacing="2">KONEC</text>
  </g>

  <!-- Cyberpunk Top-Right Glass Specular Reflection -->
  <path d="M 18 18 Q 256 18 360 40 Q 470 70 488 180 Q 420 280 280 210 Q 150 140 18 18 Z" fill="url(#glass-glare)" pointer-events="none" />
</svg>
